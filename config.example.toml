# Copy to config.toml and adjust for your machine. Linux mode commands control hardware.
# Optional touch-to-wake (Linux). Use the touchscreen's stable by-id path.
# [input]
# device = "/dev/input/by-id/usb-wch.cn_TouchScreen_9LQ0172005164-event-if00"
# wake_delay = "4s"

# Local automation is opt-in and requires input.device above.
[policy]
enabled = false
day_idle = "5m"
night_idle = "2m"
night_start = "22:00"
night_end = "07:00"
timezone = "Local" # Pi's timezone, or e.g. "America/Toronto"

[settings]
# Optional absolute path for persistent runtime overrides. Default:
# $XDG_STATE_HOME/hubctl/settings.json, or ~/.local/state/hubctl/settings.json.
# path = "/home/panel/.local/state/hubctl/settings.json"

[mqtt]
enabled = false
broker = "tcp://127.0.0.1:1883" # Replace with your LAN broker; ssl:// for TLS.
device_id = "kitchen_hub" # Unique and stable per panel.
device_name = "Kitchen Hub"
topic_prefix = "hub/kitchen"
discovery_prefix = "homeassistant"
birth_topic = "homeassistant/status"
# Credentials: HUB_MQTT_USERNAME and HUB_MQTT_PASSWORD environment variables.

[socket]
# Explicit development path for macOS. On the Pi, omit this key to use
# $XDG_RUNTIME_DIR/hubctl.sock in the graphical user's private runtime directory.
path = "/tmp/hubctl-dev.sock"

[display]
# Example only: verify the actual output name with wlr-randr on the Pi.
output = "HDMI-A-1"

[browser]
endpoint = "http://127.0.0.1:9222"
active_tab = "home"
screensaver_tab = "slideshow"

# Open these URLs manually in Chromium; order doesn't matter.
# URLs match the same origin and path subtree, ignoring queries and fragments.
[[browser.tabs]]
name = "home"
url = "http://homeassistant.local"

[[browser.tabs]]
name = "slideshow"
url = "https://www.google.com"
